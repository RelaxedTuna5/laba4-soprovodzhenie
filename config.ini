# config.ini
[jira]
base_url = https://issues.apache.org/jira
default_project = KAFKA
timeout = 30
max_results = 500

[storage]
cache_dir = cache
results_dir = results
log_dir = logs

[logging]
log_file = logs/jira_analytics.log
log_level = INFO

[visualization]
dpi = 300
figure_width = 10
figure_height = 6
